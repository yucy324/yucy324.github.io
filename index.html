<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Caiyang Yu - Homepage</title>
    <meta
      name="description"
      content="Caiyang Yu's personal homepage, publications, academic service, and contact information."
    />
    <script>document.documentElement.classList.add("js");</script>
    <link rel="stylesheet" href="./assets/css/style.css?v=20260828a13" />
  </head>
  <body class="accent-border-top content-loading" aria-busy="true">
    <header class="masthead">
      <div class="masthead__inner">
        <a class="brand" href="#overview">Homepage</a>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation menu">
          &#9776;
        </button>
        <nav class="site-nav" id="siteNav">
          <a href="#overview" class="nav-link active" id="navOverview">Profile</a>
          <a href="#news" class="nav-link" id="navNews">News</a>
          <a href="#publications" class="nav-link" id="navPublications">Publications</a>
          <a href="#service" class="nav-link" id="navService">Service</a>
          <a href="#contact" class="nav-link" id="navContact">Contact</a>
        </nav>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="profile-card reveal">
          <img
            src="./assets/img/caiyang-yu.jpg"
            alt="Caiyang Yu profile photo"
            class="avatar"
            width="150"
            height="225"
          />
          <h1 class="name" id="profileName"></h1>
          <p class="title" id="profileTitle"></p>
          <p class="bio" id="profileBio"></p>
          <div class="profile-sections" id="profileSections"></div>
          <ul class="meta-list" id="profileMeta"></ul>
        </div>
      </aside>

      <main class="content">
        <section id="overview" class="section reveal">
          <div class="overview-grid">
            <article class="summary-card">
              <p class="summary-text" id="summaryText"></p>
              <div class="lang-switch lang-switch-inline" id="langSwitch" aria-label="Language switch">
                <button type="button" class="lang-btn active" id="langBtnEn" data-lang="en">EN</button>
                <span class="lang-divider" aria-hidden="true">/</span>
                <button type="button" class="lang-btn" id="langBtnZh" data-lang="zh">中文</button>
              </div>
            </article>
          </div>
        </section>

        <section id="longterm" class="section reveal">
          <h2 id="longtermTitle">Long-term Needs</h2>
          <ul class="timeline" id="longtermList"></ul>
        </section>
        <section id="news" class="section reveal">
          <h2 id="newsTitle">News</h2>
          <ul class="timeline" id="newsList"></ul>
        </section>

        <section id="publications" class="section reveal">
          <h2 id="publicationsTitle" class="section-title-row">
            <span id="publicationsTitleText">Publications</span>
            <a id="publicationsFullListLink" class="section-title-link" href="./publications.html">(Full List)</a>
          </h2>
          <div class="chip-group" id="pubFilterChips"></div>
          <p class="filter-hint filter-hint--authors" id="pubFilterHint">★ First Author &nbsp;&nbsp; ✉ Corresponding Author</p>
          <div class="pub-list" id="pubList"></div>
        </section>

        <section id="service" class="section reveal">
          <h2 id="serviceTitle">Academic Service</h2>
          <div class="academic-service-list" id="serviceList"></div>
        </section>

        <section id="contact" class="section reveal">
          <h2 id="contactTitle">Contact</h2>
          <p id="contactText"></p>
        </section>
      </main>
    </div>

    <footer class="footer">
      <p><span id="updatedLabel">Updated at</span> <span id="updatedAt"></span> | <span id="footerInspired">Inspired by academic homepage style.</span></p>
    </footer>

    <script>
      window.CONTENT_BASE_PATH = "./content";
      window.contentReadyFallback = window.setTimeout(function () {
        document.body.classList.remove("content-loading");
        document.body.removeAttribute("aria-busy");
      }, 4000);
    </script>
    <script src="./assets/js/main.js?v=20260828a13"></script>
  </body>
</html>
